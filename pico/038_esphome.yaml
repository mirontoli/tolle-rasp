# Raspberry Pi Pico W + SparkFun SerLCD 20x4 (I2C)
# Home Assistant electricity and water dashboard
# Labels: P=price, W=watts, D=today electricity, M=month electricity,
#         V=today water, K=month water (Kamstrup)

esphome:
  name: tollepicow
  friendly_name: tollepicow

rp2:
  board: rpipicow

logger:

api:
  encryption:
    key: !secret tollepicow__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: tollepicow Fallback Hotspot
    password: !secret tollepicow__ap_password

captive_portal:

output:
  - platform: gpio
    pin: LED
    id: onboard_led

light:
  - platform: binary
    name: "Onboard LED"
    output: onboard_led

i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 100kHz

i2c_device:
  id: serlcd
  address: 0x72

sensor:
  - platform: homeassistant
    id: full_price
    entity_id: sensor.electricity_full_price
  - platform: homeassistant
    id: current_power
    entity_id: sensor.tibber_pulse_gunanga_power
  - platform: homeassistant
    id: electricity_today
    entity_id: sensor.electricity_variable_cost_today
  - platform: homeassistant
    id: electricity_month
    entity_id: sensor.electricity_variable_cost_this_month
  - platform: homeassistant
    id: water_today
    entity_id: sensor.water_variable_cost_today
  - platform: homeassistant
    id: water_month
    entity_id: sensor.water_variable_cost_this_month

globals:
  - id: display_initialized
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: previous_values
    type: std::array<std::string, 6>
    restore_value: no

script:
  - id: initialize_display
    mode: single
    then:
      - lambda: |-
          const uint8_t clear_cmd[] = {0x7C, 0x2D};
          id(serlcd).write(clear_cmd, sizeof(clear_cmd));
          delay(100);

          auto label = [&](uint8_t pos, const char *text) {
            const uint8_t cursor[] = {0xFE, pos};
            id(serlcd).write(cursor, sizeof(cursor));
            delay(20);
            id(serlcd).write((const uint8_t *) text, strlen(text));
            delay(20);
          };

          label(0x80, "P:");
          label(0x89, "W:");
          label(0xC0, "D:");
          label(0xC9, "M:");
          label(0xD4, "V:");
          label(0xDD, "K:");

          for (auto &value : id(previous_values)) {
            value.clear();
          }
          id(display_initialized) = true;

  - id: refresh_display
    mode: restart
    then:
      - lambda: |-
          if (!id(display_initialized)) return;

          auto update = [&](int index, uint8_t position,
                            float value, int width, int decimals) {
            char text[16];
            if (!std::isfinite(value)) {
              snprintf(text, sizeof(text), "%*s", width, "--");
            } else {
              snprintf(text, sizeof(text), "%0*.*f", width, decimals, value);
            }

            // Do not overwrite adjacent fields if a value is too wide.
            if (strlen(text) != (size_t) width) {
              memset(text, '-', width);
              text[width] = '\0';
            }

            if (id(previous_values)[index] == text) return;

            const uint8_t cursor[] = {0xFE, position};
            id(serlcd).write(cursor, sizeof(cursor));
            delay(20);
            id(serlcd).write((const uint8_t *) text, strlen(text));
            delay(20);
            id(previous_values)[index] = text;
          };

          // Row 1: full electricity price and current power.
          update(0, 0x82, id(full_price).state, 6, 2);
          update(1, 0x8B, id(current_power).state, 4, 0);

          // Row 2: variable electricity costs.
          update(2, 0xC2, id(electricity_today).state, 6, 2);
          update(3, 0xCB, id(electricity_month).state, 4, 0);

          // Row 4: variable water costs. K is rounded to whole SEK.
          update(4, 0xD6, id(water_today).state, 6, 2);
          update(5, 0xDF, id(water_month).state, 4, 0);

interval:
  # One-time initialization after the LCD has had time to start.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return !id(display_initialized) && millis() >= 5000;'
          then:
            - script.execute: initialize_display
            - script.execute: refresh_display

  # Regular updates without clearing the screen.
  - interval: 5s
    then:
      - script.execute: refresh_display
        
  - interval: 30s
    then:
      - lambda: |-
          ESP_LOGI("debug", "P from HA: %.2f", id(full_price).state);
