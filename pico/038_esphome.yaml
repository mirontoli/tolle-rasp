# Board: Raspberry Pi Pico W
# Definition: definitions/boards/rpipicow/manifest.yaml
# tollepicow.yaml
# 2026-10-25
# shows spot price, full price and current power on a 20x4 LCD connected via I2C

esphome:
  name: tollepicow
  friendly_name: tollepicow
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          // Clear display once at startup
          const uint8_t clear_cmd[] = {0x7C, 0x2D};
          id(serlcd).write(clear_cmd, sizeof(clear_cmd));
          delay(100);

          // Write static labels once
          auto label = [&](uint8_t pos, const char *text) {
            const uint8_t cursor[] = {0xFE, pos};
            id(serlcd).write(cursor, sizeof(cursor));
            id(serlcd).write(
              (const uint8_t *) text, strlen(text));
          };

          // Row 1
          label(0x80, "F:");
          label(0x89, "E:");

          // Row 2
          label(0xC0, "D:");
          label(0xC9, "M:");

          // Row 4
          label(0xD4, "V:");
          label(0xDD, "W:");

          // Force first refresh of all values
          id(display_initialized) = true;
          id(refresh_display).execute();

rp2:
  board: rpipicow

logger:

api:
  encryption:
    key: !secret tollepicow__encryption_key
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: tollepicow Fallback Hotspot
    password: !secret tollepicow__ap_password
captive_portal:

# Inbyggd LED på Pico W
output:
  - platform: gpio
    pin: LED
    id: onboard_led

light:
  - platform: binary
    name: "Onboard LED"
    output: onboard_led

i2c:
  sda: GPIO20
  scl: GPIO21
  scan: true
  frequency: 100kHz

i2c_device:
  id: serlcd
  address: 0x72

# Home Assistant sensors
sensor:
  - platform: homeassistant
    id: full_price
    entity_id: sensor.tibber_pulse_gunanga_electricity_price
  - platform: homeassistant
    id: current_power
    entity_id: sensor.tibber_pulse_gunanga_power
  - platform: homeassistant
    id: electricity_today
    entity_id: sensor.electricity_variable_cost_today
  - platform: homeassistant
    id: electricity_month
    entity_id: sensor.electricity_variable_cost_this_month
  - platform: homeassistant
    id: water_today
    entity_id: sensor.water_variable_cost_today
  - platform: homeassistant
    id: water_month
    entity_id: sensor.water_variable_cost_this_month

globals:
  - id: display_initialized
    type: bool
    restore_value: no
    initial_value: 'false'

# Update only fields that have changed
script:
  - id: refresh_display
    mode: restart
    then:
      - lambda: |-
          if (!id(display_initialized)) return;

          // Each field remembers its last displayed text.
          static char previous[6][9] = {{0}};

          auto update = [&](int index, uint8_t position,
                            float value, int width, int decimals,
                            float multiplier = 1.0f) {
            char text[16];

            if (!std::isfinite(value)) {
              snprintf(text, sizeof(text), "%*s", width, "--");
            } else {
              float scaled = value * multiplier;
              snprintf(text, sizeof(text), "%0*.*f",
                       width, decimals, scaled);
            }

            // Prevent overflowing into the next field.
            if (strlen(text) != (size_t) width) {
              memset(text, '-', width);
              text[width] = '\0';
            }

            if (strcmp(previous[index], text) == 0) return;

            const uint8_t cursor[] = {0xFE, position};
            id(serlcd).write(cursor, sizeof(cursor));
            id(serlcd).write(
              (const uint8_t *) text, strlen(text));

            strcpy(previous[index], text);
          };

          // Row 1: full price and power (W)
          update(0, 0x82, id(full_price).state, 5, 2);
          update(1, 0x8B, id(current_power).state, 4, 0);

          // Row 2: electricity costs
          update(2, 0xC2, id(electricity_today).state, 6, 2);
          update(3, 0xCB, id(electricity_month).state, 7, 2);

          // Row 4: water costs
          update(4, 0xD6, id(water_today).state, 6, 2);
          update(5, 0xDF, id(water_month).state, 7, 2);

# Refresh regularly, but write only changed values
interval:
  - interval: 5s
    then:
      - script.execute: refresh_display